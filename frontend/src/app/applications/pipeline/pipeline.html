<div
  class="bar"
  aria-hidden="true"
  [class.bar-empty]="stats().total === 0"
  [class.bar-filtered]="selected()"
>
  @for (segment of visibleSegments(); track segment.status) {
    <span
      class="segment"
      [attr.data-status]="segment.status"
      [class.segment-selected]="selected() === segment.status"
      [style.flex-grow]="segment.share"
    ></span>
  }
</div>

<ul class="legend" aria-label="Filter by status">
  @for (segment of segments(); track segment.status) {
    <li>
      <button
        type="button"
        class="legend-item"
        [attr.data-status]="segment.status"
        [attr.aria-pressed]="selected() === segment.status"
        [disabled]="segment.count === 0 && selected() !== segment.status"
        (click)="toggle(segment.status)"
      >
        <app-status-icon [status]="segment.status" />
        <span class="legend-label">{{ segment.label }}</span>
        <span class="legend-count">{{ segment.count }}</span>
      </button>
    </li>
  }
</ul>
