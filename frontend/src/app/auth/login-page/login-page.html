<app-auth-layout>
  <div>
    <h1>Sign in</h1>
    <p class="lede">Pick up where you left off.</p>
  </div>

  <form novalidate (submit)="signIn($event)">
    @if (formError()) {
      <p class="form-error" role="alert">{{ formError() }}</p>
    }

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        class="input"
        type="email"
        autocomplete="username"
        spellcheck="false"
        enterkeyhint="next"
        autofocus
        [formField]="form.email"
        [attr.aria-invalid]="showError(form.email)"
        [attr.aria-describedby]="showError(form.email) ? 'email-error' : null"
      />
      @if (showError(form.email)) {
        <p class="field-error" id="email-error">{{ errorText(form.email) }}</p>
      }
    </div>

    <div class="field">
      <label for="current-password">Password</label>
      <div class="password-field">
        <input
          #password
          id="current-password"
          class="input"
          type="password"
          autocomplete="current-password"
          enterkeyhint="done"
          [formField]="form.password"
          [attr.aria-invalid]="showError(form.password)"
          [attr.aria-describedby]="showError(form.password) ? 'password-error' : null"
        />
        <app-password-toggle [control]="password" />
      </div>
      @if (showError(form.password)) {
        <p class="field-error" id="password-error">{{ errorText(form.password) }}</p>
      }
    </div>

    <button type="submit" class="btn btn-primary submit" [disabled]="form().submitting()">
      {{ form().submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch">
    New here?
    <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl() }">Create an account</a>
  </p>
</app-auth-layout>
