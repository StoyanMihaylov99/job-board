spring:
  application:
    name: job-board
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jobboard}
    username: ${DB_USERNAME:jobboard}
    password: ${DB_PASSWORD:jobboard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  docker:
    compose:
      lifecycle-management: start-only
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
